# Techchefs WMS on NAS
# Public: https://warehouse.techchefstx.work  (your existing Cloudflare tunnel)
# LAN:    http://192.168.0.24:3090
#
# On the NAS, in this folder:
#   1. Copy env.nas.example → .env  (edit passwords if you want)
#   2. docker compose up -d --build
#   3. In Cloudflare: warehouse.techchefstx.work → http://192.168.0.24:3090

services:
  db:
    image: postgres:16-alpine
    container_name: wms-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      TZ: America/Chicago
      POSTGRES_USER: ${POSTGRES_USER:-wms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy env.nas.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-wms}
    volumes:
      - wms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wms} -d ${POSTGRES_DB:-wms}"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: techchefs-wms:latest
    container_name: wms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3090:3090"
    environment:
      TZ: America/Chicago
      DATABASE_URL: postgresql://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wms}
      AUTH_SECRET: ${AUTH_SECRET:?Copy env.nas.example to .env first}
      APP_URL: ${APP_URL:-https://warehouse.techchefstx.work}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-dispatch@techchefstx.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Copy env.nas.example to .env first}
      ADMIN_NAME: ${ADMIN_NAME:-Dispatch}
      SEED_DEMO: ${SEED_DEMO:-true}

volumes:
  wms-pgdata:
